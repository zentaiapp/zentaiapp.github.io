<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="pvTitle" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="pvTitle">PeerVoice</title>
  <defs>
    <linearGradient id="pvNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pvWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="pvBgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0D0D12"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#pvBgGrad)"/>

  <!-- left peer node -->
  <circle cx="21" cy="60" r="10" fill="url(#pvNodeGrad)"/>
  <circle cx="21" cy="60" r="10" fill="none" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2"/>

  <!-- right peer node -->
  <circle cx="99" cy="60" r="10" fill="url(#pvNodeGrad)"/>
  <circle cx="99" cy="60" r="10" fill="none" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="2"/>

  <!-- live audio bridge between the two peers -->
  <g fill="url(#pvWaveGrad)">
    <rect x="37" y="51" width="6" height="18" rx="3"/>
    <rect x="48" y="42" width="6" height="36" rx="3"/>
    <rect x="59" y="30" width="6" height="60" rx="3"/>
    <rect x="70" y="42" width="6" height="36" rx="3"/>
    <rect x="81" y="51" width="6" height="18" rx="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
