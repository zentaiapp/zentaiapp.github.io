<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You've got a wish — Wishly</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1430">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wish-stage">
    <div id="wishCard" class="wish-card theme-dusk">
      <div class="confetti" id="confetti"></div>
      <div class="wish-occasion" id="wishOccasion">Occasion</div>
      <h1 class="wish-name" id="wishName">Someone</h1>
      <p class="wish-message" id="wishMessage"></p>
      <p class="wish-from" id="wishFrom"></p>

      <div class="wish-actions">
        <button id="copyBtn" type="button">Copy this link</button>
        <a id="waBtn" href="#" target="_blank" rel="noopener">Share on WhatsApp</a>
      </div>
    </div>
  </div>

  <p class="make-your-own">Liked this? <a href="index.html">Make your own wishing page</a></p>

  <script src="script.js"></script>
</body>
</html>
